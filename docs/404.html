<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Wick</title>
<link rel="icon" href="/wick/icons/light-72.png">
<meta name="theme-color" content="#12100E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Absolute paths: GitHub Pages serves this file at whatever path was asked for. -->
<link rel="stylesheet" href="/wick/assets/site.css">
<script>
  // GitHub Pages serves this file for any path with no matching file. The
  // pairing screen on the TV links to /wick/pair/<6-digit-code> — a real
  // page per code can't exist (codes are generated on demand) — so this is
  // the only handler that ever actually sees that URL. Redirect into the
  // one real page (docs/pair/index.html) with the code as a query param;
  // anything else falls through to the "not found" page below. It runs in
  // the head, before anything is drawn, so a pairing link never flashes it.
  const match = location.pathname.match(/\/pair\/(\d{6})\/?$/);
  if (match) {
    location.replace(`${location.pathname.slice(0, match.index)}/pair/?code=${match[1]}`);
  }
</script>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/wick/"><img src="/wick/icons/light-72.png" alt="">Wick</a>
  </div>
</header>

<main class="center-page">
  <div class="center-card">
    <p class="kicker">404</p>
    <h1>This page isn't here.</h1>
    <p class="lede" style="margin:0 auto 30px">The link may be old, or the address mistyped.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn primary" href="/wick/">Go to Wick</a>
      <a class="btn" href="https://dmaz25jvryojp.cloudfront.net/">Open the family app</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Wick · MIT licensed</span>
    <nav aria-label="Footer"><a href="/wick/">Home</a><a href="/wick/privacy.html">Privacy</a><a href="/wick/terms.html">Terms</a><a href="https://github.com/rogerjeasy/wick">GitHub</a></nav>
  </div>
</footer>
</body>
</html>
