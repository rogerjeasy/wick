#
# Wick — Vega OS application manifest.
#
# Structure and identifiers verified against AmazonAppDev/vega-video-sample
# (2026-09-14). See docs/WICK-TECHNICAL.md §3.1 and Appendix A.
#
# NOT declared, deliberately: IContentLauncherServer and IAccountLoginServer are
# select-partner gated with no sandbox. Declaring what you cannot exercise is
# worse than omitting it. Tracked in FRICTION.md.
#
schema-version = 1

[package]
id           = "com.wick.tv"
title        = "Wick"
version      = "0.1.0"
build_number = 1
icon         = "@image/Wick.png"

[os.version]
min    = "1.2"
target = "1.2"

# -----------------------------------------------------------------------------
# Components
# -----------------------------------------------------------------------------
[components]

# Main UI — cards, player, all rendering.
[[components.interactive]]
id             = "com.wick.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories     = ["com.amazon.category.main", "com.amazon.category.kepler.media"]
launch-type    = "singleton"

# Holds the device channel; receives cards while the app package is alive.
#
# vpt's own manifest validator suggests replacing the runtime-module below
# with the headless loader ('/com.amazon.kepler.headless.runtime.loader_2@
# IKeplerScript_2_0') since this component owns its own process. Tried it
# (2026-09-19): vpt then HARD-FAILS validation instead — "all runtime
# modules declared must use the same version" — because com.wick.tv.main is
# a real interactive UI component and cannot run under that loader, and the
# platform requires every component in one manifest to share one runtime
# version. The advisory contradicts the platform's own hard constraint for
# any manifest mixing interactive and headless-service components, which
# this one necessarily does. See FRICTION.md.
[[components.service]]
id             = "com.wick.tv.card.service"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type    = "singleton"

# Serves real Watch Activity to the platform. Feeds Continue Watching AND the
# Rhythm pillar — one integration, two purposes. See §3.3. Same
# headless-runtime advisory/hard-constraint contradiction as
# com.wick.tv.card.service above — not changed, for the same reason.
[[components.service]]
id             = "com.wick.tv.content.dataRefresh.provider"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type    = "singleton"

# Nightly batch upload of local playback events.
[[components.task]]
id             = "com.wick.tv.rhythmSyncTask"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"

# First-run pairing state.
[[components.task]]
id             = "com.wick.tv.onInstallTask"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"

# -----------------------------------------------------------------------------
# Processes — the card service is isolated so a UI crash cannot drop the channel.
# -----------------------------------------------------------------------------
[processes]

[[processes.group]]
id             = "main"
component-ids = ["com.wick.tv.main"]

[[processes.group]]
id             = "card_service"
component-ids = ["com.wick.tv.card.service"]

[[processes.group]]
id             = "data_refresh"
component-ids = ["com.wick.tv.content.dataRefresh.provider"]

# -----------------------------------------------------------------------------
# Wants — optional capabilities. Handle graceful fallback for each.
# -----------------------------------------------------------------------------
[wants]

[[wants.service]]
id = "com.amazon.tv.developer.dataservice"          # personalization data service

[[wants.privilege]]
id = "com.amazon.tv.content-personalization.privilege.provide-data"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"   # screen-reader state

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"       # transport controls / voice

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"                     # ducking, never muting

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.inputd.service"                    # remote button events

[[wants.service]]
id = "com.amazon.network.service"

# -----------------------------------------------------------------------------
# Needs — required for the app to function.
# -----------------------------------------------------------------------------
[needs]

[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# -----------------------------------------------------------------------------
# Lifecycle tasks
# -----------------------------------------------------------------------------

[[needs.module]]
id = "/com.amazon.kepler.headless_task_manager_1@IHeadlessTaskManager_2"

[[needs.module]]
id = "/com.amazon.kepler.kepler_content_personalization_1@IKeplerContentPersonalization_3"

[[needs.module]]
id = "/com.amazon.kepler.kepler_epg_provider_1@IKeplerEpgProvider_9"

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"








[tasks]

[[tasks.work]]
component-id = "com.wick.tv.onInstallTask"
mode         = "install"

# -----------------------------------------------------------------------------
# Offers
# -----------------------------------------------------------------------------
[offers]

[[offers.service]]
id = "com.wick.tv.content.dataRefresh.provider"

# Without this, nothing tells the platform com.wick.tv.card.service exists to
# be launched — confirmed missing 2026-09-19: the process never spawned even
# once (vega device running-apps never listed it, no LaunchComponent request
# for it in the device log, across every relaunch this session), so
# onStartCardService() never ran and the device channel never opened,
# independent of the pairing/token issue FRICTION.md FL-013 documents. See
# FRICTION.md.
[[offers.service]]
id = "com.wick.tv.card.service"

[[offers.interaction]]
id = "com.wick.tv.main"

# A message URI is only usable via the Message Router when it is part of a
# declared module (Kepler Messaging User Guide, "Author Messages" — do not
# use a URI via Message Router unless it is part of a module). This is what
# launches com.wick.tv.main.
[[offers.module]]
id                 = "/com.wick.tv.module@IMain_1"
includes-messages  = ["pkg://com.wick.tv.main"]

[[message]]
uri                  = "pkg://com.wick.tv.main"
sender-privileges    = ["*"]
receiver-privileges  = ["self"]

# -----------------------------------------------------------------------------
# Extras — Amazon feature integration declarations
# -----------------------------------------------------------------------------
[[extras]]
key          = "interface.provider"
component-id = "com.wick.tv.main"

[extras.value.application]

[[extras.value.application.interface]]
interface_name    = "com.amazon.kepler.media.IContentPersonalizationServer"
attribute_options = ["SupportedCustomerLists", "DataRefreshComponentId"]

[extras.value.application.interface.static_values]
SupportedCustomerLists = ["Watchlist"]
DataRefreshComponentId = "com.wick.tv.content.dataRefresh.provider"

[[extras.value.application.interface]]
interface_name  = "com.amazon.kepler.media.IMediaPlaybackServer"
command_options = ["Play", "Pause", "StartOver", "Previous", "Next"]
