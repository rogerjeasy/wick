<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0b0a09" />
<title>Wick — her television</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="vendor/fonts.css" />
<link rel="stylesheet" href="vendor/open-props.css" />
<link rel="stylesheet" href="tv.css" />
</head>
<body>

<!--
  Her television, in a browser tab: a sixteen-by-nine screen drawn as the Vega app draws it, and around it only
  what someone trying it needs — a line that says it is a stand-in, and a remote that can be pressed with a mouse
  or a finger (tv.js builds its buttons). The keyboard is the remote too. The engineers' console is device.html.
-->
<div class="room" id="room">
  <p class="stand-in" id="tv-standin">A stand-in for her Fire TV, in your browser. The keyboard is the remote.</p>

  <div class="room-body">
    <main class="stage" id="stage">
      <div id="tv-screen" class="tv-screen" aria-live="polite"></div>
    </main>

    <aside id="tv-remote" class="remote" aria-label="The remote">
      <div id="tv-remote-buttons" class="remote-buttons"></div>

      <aside id="tv-keys" class="tv-keys" aria-label="The keyboard is the remote" hidden>
        <p class="tv-keys-title">The keyboard is the remote</p>
        <dl>
          <dt>← ↑ → ↓</dt><dd>Move. Over a film, ← → skip 30 s, ↑ ↓ show the bar</dd>
          <dt>Enter</dt><dd>OK</dd>
          <dt>Hold Enter 2 s</dt><dd>Ask someone to ring her</dd>
          <dt>Backspace or Esc</dt><dd>Back</dd>
          <dt>Space or P</dt><dd>Play / Pause; reads a card aloud</dd>
          <dt>?</dt><dd>Show or hide this</dd>
        </dl>
        <button type="button" id="tv-keys-close" class="tv-keys-close">Got it</button>
      </aside>
    </aside>
  </div>
</div>

<script src="vendor/icons.generated.js"></script>
<script src="vendor/motion.generated.js"></script>
<script src="tv-engine.generated.js"></script>
<script src="tv-channels.generated.js"></script>
<script src="tv-core.js"></script>
<script src="tv.js"></script>
</body>
</html>
