name: deploy-edge

on:
  push:
    branches: [main]
    paths: ['services/edge-ring/**', 'services/edge-device/**', 'infra/**', 'apps/sim-alexa/**', 'addon-package/**']
  workflow_dispatch:

# OIDC only. No static AWS keys in this repository, ever — the role ARN is not
# a credential, it is the name of a role that will only mint one for a token
# GitHub signed for this repo.
permissions:
  contents: read
  id-token: write

# Same group as deploy-agent: both apply the one shared infra/ Terraform
# root against the one S3 state, and a push can touch both workflows' path
# filters at once (e.g. infra/agent.tf + services/agent/**). Two different
# groups let them race for the state lock — see the incident this comment
# was added for.
concurrency:
  group: terraform-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without the role configured this would authenticate as nobody and fail
    # halfway through an apply. Skipping is the honest outcome.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tests-then-deploy ordering: never ship an edge whose contracts are red.
      - run: npm run verify

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      # infra/ is one shared Terraform root — this workflow's apply reconciles
      # ALL of it, not just edge-ring/edge-device, including infra/agent.tf's
      # archive_file which zips services/agent/.build/door-event. That's
      # gitignored esbuild output, so it has to be built fresh here too, the
      # same way deploy-agent.yml does — skipping it is what "Archive
      # creation error" means.
      - run: npm run build:lambda

      # Terraform, not CDK — CDK was replaced in 90d49cd and these workflows
      # still said otherwise.
      - run: terraform -chdir=infra init -input=false
      # The alarms' email subscription (infra/alarms.tf). A secret, not a
      # variable: this repository's logs are public, and Actions masks it.
      # Unset, the apply subscribes nobody.
      - run: terraform -chdir=infra apply -input=false -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

      # Ring credentials are NOT set here. They live in Secrets Manager
      # (wick/ring/credentials, wick/ring/tokens) and are seeded once by
      # infra/bootstrap/put-ring-secret.sh. A deploy must never carry them.
      # The edge's own Lambda must be what answers, whichever way this
      # deployment is set. /ring/authorize is the operator's link:
      #   302  it is on (var.ring_operator_link) and redirects to Ring;
      #   404 in Wick's own words  it is off, the default now that a home's
      #        organiser connects Ring from the family app.
      # API Gateway's own 404 ({"message":"Not Found"}) or any 5xx means the
      # route or the function is not there, and fails the deploy.
      - name: confirm the edge answers
        run: |
          url=$(terraform -chdir=infra output -raw ring_authorize_url)
          body=$(mktemp)
          code=$(curl -s -o "$body" -w '%{http_code}' "$url")
          echo "GET $url -> $code"
          if [ "$code" = "302" ]; then exit 0; fi
          if [ "$code" = "404" ] && grep -q "Wick family app" "$body"; then exit 0; fi
          echo "expected a 302 redirect to Ring, or the edge's own 404 when the operator's link is off"
          exit 1
