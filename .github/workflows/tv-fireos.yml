name: tv-fireos

# The Fire OS app builds from the Vega app's source, so a change to either —
# or to the packages both draw on — is a change to this build.
#
# Two jobs, and the line between them is the point:
#
#   build    every push and pull request. Holds no secret at all, and signs
#            with a throwaway key made on the runner: the APK is for looking
#            at, never for installing over another. Nothing a pull request
#            changes (a Gradle script, an npm package) can reach the release key,
#            because this job is never given it.
#   release  a tag `v*` only, in the GitHub environment `release` (which should
#            require a reviewer and allow only tags — docs/SETUP.md). The only
#            place the release key is read, and only by the steps that use it.
#            No key, no APK: it fails rather than signing with another.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/tv-fireos/**', 'apps/tv-vega/src/**', 'apps/tv-vega/assets/**', 'packages/**', '.github/workflows/tv-fireos.yml']
  pull_request:
    paths: ['apps/tv-fireos/**', 'apps/tv-vega/src/**', 'apps/tv-vega/assets/**', 'packages/**', '.github/workflows/tv-fireos.yml']

# Touches no AWS.
permissions:
  contents: read

jobs:
  build:
    name: type-check and build the APK (throwaway key)
    # A tag has its own job below, with the key.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv-fireos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/tv-fireos/package-lock.json
      # React Native 0.83's Gradle plugin asks for a Java 17 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Not a workspace of the root package: here `react-native` is
      # react-native-tvos (see package.json's comment).
      - run: npm ci
      # The Vega source, checked a second time against the Fire OS adapters.
      - run: npm run typecheck
      # The release type, so the JavaScript is bundled by Gradle too, signed with a key made here and
      # thrown away: the build needs one (WICK_REQUIRE_RELEASE_KEY) so that what is checked below is
      # the signing, not the fallback. One architecture is enough to prove the build. The native
      # side's own decisions (android/app/src/test) run first, on the JVM.
      - name: Build, signed with a throwaway key
        working-directory: apps/tv-fireos/android
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass "$password" -keypass "$password" \
            -alias wick-throwaway -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Wick throwaway build, O=Wick"
          WICK_RELEASE_STORE_FILE="$RUNNER_TEMP/throwaway.jks" WICK_RELEASE_STORE_PASSWORD="$password" \
          WICK_RELEASE_KEY_ALIAS=wick-throwaway WICK_RELEASE_KEY_PASSWORD="$password" WICK_REQUIRE_RELEASE_KEY=true \
            ./gradlew testReleaseUnitTest assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Check who signed the APK
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs apps/tv-fireos/android/app/build/outputs/apk/release/app-release.apk)"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi
          echo "$certs" | grep -q "CN=Wick throwaway build" || { echo "::error::The APK was not signed with the key it was given."; exit 1; }
          echo "APK signed with a throwaway key: to look at, not to install over another." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wick-fireos-apk
          path: apps/tv-fireos/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: build the release APK (release key)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Holds WICK_RELEASE_KEYSTORE_BASE64, WICK_RELEASE_STORE_PASSWORD, WICK_RELEASE_KEY_ALIAS and
    # WICK_RELEASE_KEY_PASSWORD, and asks a reviewer before it runs.
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/tv-fireos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/tv-fireos/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No setup-gradle here: this job holds the release key, so it runs only the repo's own wrapper.
      - run: npm ci
      - run: npm run typecheck
      # The only step that sees the key: it is decoded, used and left in this step's own environment.
      - name: Build, signed with the release key
        working-directory: apps/tv-fireos/android
        env:
          KEYSTORE_BASE64: ${{ secrets.WICK_RELEASE_KEYSTORE_BASE64 }}
          WICK_RELEASE_STORE_PASSWORD: ${{ secrets.WICK_RELEASE_STORE_PASSWORD }}
          WICK_RELEASE_KEY_ALIAS: ${{ secrets.WICK_RELEASE_KEY_ALIAS }}
          WICK_RELEASE_KEY_PASSWORD: ${{ secrets.WICK_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$WICK_RELEASE_STORE_PASSWORD" ] || [ -z "$WICK_RELEASE_KEY_ALIAS" ] || [ -z "$WICK_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::A release needs the release key: set the WICK_RELEASE_* secrets in the 'release' environment (docs/SETUP.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wick-release.jks"
          WICK_RELEASE_STORE_FILE="$RUNNER_TEMP/wick-release.jks" WICK_REQUIRE_RELEASE_KEY=true \
            ./gradlew testReleaseUnitTest assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain
          rm -f "$RUNNER_TEMP/wick-release.jks"
      - name: Check who signed the APK
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs apps/tv-fireos/android/app/build/outputs/apk/release/app-release.apk)"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi
          echo "Release APK signed by the release key." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attach the APK to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apps/tv-fireos/android/app/build/outputs/apk/release/app-release.apk "wick-fireos-${GITHUB_REF_NAME#v}.apk"
          gh release upload "$GITHUB_REF_NAME" "wick-fireos-${GITHUB_REF_NAME#v}.apk" --clobber
